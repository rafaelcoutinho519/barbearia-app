<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel dos Barbeiros - Brooklyn Barbearia</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-main: #121212;
            --card-bg: #1a1a1a;
            --gold: #d4af37;
            --gold-hover: #e6c552;
            --text-main: #ffffff;
            --text-muted: #a0a0a0;
            --border-color: #2a2a2a;
        }

        body { 
            font-family: 'Poppins', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background: radial-gradient(circle at 50% -10%, #1e1b14 0%, var(--bg-main) 55%); 
            color: var(--text-main); 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
            margin: 0; 
            padding: 15px;
            box-sizing: border-box;
        }

        .card { 
            background: var(--card-bg); 
            padding: 30px 25px; 
            border-radius: 18px; 
            box-shadow: 0 12px 32px rgba(0,0,0,0.55); 
            width: 100%; 
            max-width: 450px; 
            text-align: center; 
            border: 1px solid var(--border-color);
        }

        .selo-barbearia {
            width: 56px;
            height: 56px;
            margin: 0 auto 12px auto;
            border-radius: 50%;
            background: linear-gradient(145deg, #2a2a2a, #161616);
            border: 1px solid rgba(212, 175, 55, 0.4);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 26px;
            box-shadow: 0 0 18px rgba(212, 175, 55, 0.15);
        }

        h2 {
            color: var(--gold);
            letter-spacing: 0.5px;
            margin-bottom: 4px;
            font-size: 21px;
            font-weight: 600;
        }

        .subtitulo-painel {
            color: var(--text-muted);
            font-size: 12px;
            letter-spacing: 1px;
            text-transform: uppercase;
            margin-bottom: 22px;
        }

        input, select, button { 
            width: 100%; 
            padding: 14px; 
            margin-top: 15px; 
            border-radius: 10px; 
            border: 1px solid var(--border-color); 
            background: #242424; 
            color: var(--text-main); 
            box-sizing: border-box; 
            font-size: 15px;
            font-family: inherit;
            outline: none;
            transition: all 0.3s ease;
        }

        input:focus, select:focus {
            border-color: var(--gold);
        }

        button { 
            background: var(--gold); 
            color: #121212; 
            font-weight: bold; 
            cursor: pointer; 
            border: none; 
            box-shadow: 0 4px 12px rgba(212, 175, 55, 0.2);
        }

        button:hover { 
            background: var(--gold-hover); 
            transform: translateY(-1px);
        }

        .hidden { display: none; }

        .contador-badge {
            background: rgba(212, 175, 55, 0.1);
            border: 1px solid rgba(212, 175, 55, 0.3);
            color: var(--gold);
            padding: 10px;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 15px;
            text-align: center;
        }

        .agendamento-item { 
            background: #222222; 
            padding: 16px; 
            margin-top: 15px; 
            border-radius: 12px; 
            text-align: left; 
            border-left: 4px solid var(--gold);
            box-shadow: 0 2px 6px rgba(0,0,0,0.3);
            transition: transform 0.15s ease, box-shadow 0.15s ease;
        }
        .agendamento-item:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(0,0,0,0.4);
        }

        .agendamento-header {
            font-size: 16px;
            color: var(--gold);
            margin-bottom: 8px;
            font-weight: bold;
        }

        .agendamento-info {
            font-size: 14px;
            color: var(--text-muted);
            line-height: 1.5;
        }

        .agendamento-info strong {
            color: var(--text-main);
        }

        .acoes-container {
            margin-top: 12px; 
            display: flex; 
            gap: 10px; 
        }

        .btn-whatsapp {
            background: #25d366; 
            color: #fff; 
            padding: 10px 12px; 
            text-decoration: none; 
            border-radius: 8px; 
            font-weight: bold; 
            font-size: 13px; 
            text-align: center; 
            flex: 1;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            box-shadow: none;
        }
        .btn-whatsapp:hover { background: #20ba5a; transform: none; }

        .btn-cancelar {
            background: #b93a3a; 
            color: #fff; 
            padding: 10px 12px; 
            border: none; 
            border-radius: 8px; 
            cursor: pointer; 
            font-size: 13px; 
            width: auto; 
            margin-top: 0; 
            flex: 1;
            box-shadow: none;
        }
        .btn-cancelar:hover { background: #a03030; transform: none; }

        #agenda-lista {
            max-height: 380px; 
            overflow-y: auto; 
            padding-right: 2px;
        }

        #agenda-lista::-webkit-scrollbar {
            width: 6px;
        }
        #agenda-lista::-webkit-scrollbar-thumb {
            background: #333;
            border-radius: 3px;
        }
        .card-painel {
            max-width: 480px;
        }

        .semana-nav {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 14px;
        }

        .semana-nav-btn {
            width: auto;
            margin-top: 0;
            padding: 8px 14px;
            background: #242424;
            color: var(--gold);
            font-size: 16px;
            font-weight: bold;
            flex: none;
            border-radius: 50%;
            line-height: 1;
        }
        .semana-nav-btn:hover {
            background: #2c2c2c;
        }

        .semana-label {
            font-size: 13px;
            font-weight: 500;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .dias-tabs {
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            gap: 6px;
            margin-bottom: 18px;
        }

        .dia-tab {
            width: 100%;
            margin-top: 0;
            padding: 10px 2px;
            background: #1f1f1f;
            border: 1px solid var(--border-color);
            border-radius: 10px;
            text-align: center;
            cursor: pointer;
            transition: transform 0.15s ease, background 0.15s ease, border-color 0.15s ease;
        }

        .dia-tab:active {
            transform: scale(0.95);
        }

        .dia-tab .dia-nome {
            display: block;
            font-size: 11px;
            font-weight: bold;
            color: var(--text-muted);
            letter-spacing: 0.5px;
        }

        .dia-tab .dia-numero {
            display: block;
            font-size: 16px;
            font-weight: bold;
            color: var(--text-main);
            margin-top: 2px;
        }

        .dia-tab.hoje .dia-nome {
            color: var(--gold);
        }

        .dia-tab.selecionado {
            background: var(--gold);
            border-color: var(--gold);
            box-shadow: 0 4px 12px rgba(212, 175, 55, 0.25);
        }

        .dia-tab.selecionado .dia-nome,
        .dia-tab.selecionado .dia-numero {
            color: #121212;
        }

        .dia-tab:hover:not(.selecionado) {
            border-color: var(--gold);
        }

        @media (max-width: 380px) {
            .dia-tab .dia-nome { font-size: 10px; }
            .dia-tab .dia-numero { font-size: 14px; }
            .dia-tab { padding: 8px 1px; }
        }
    </style>
</head>
<body>

    <div class="card" id="login-card">
        <div class="selo-barbearia">💈</div>
        <h2>Painel dos Barbeiros</h2>
        <div class="subtitulo-painel">Brooklyn Barbearia</div>
        <select id="barbeiro">
            <option value="Karlos">Karlos</option>
            <option value="Dorgivan">Dorgivan</option>
            <option value="David">David</option>
        </select>
        <input type="password" id="pin" placeholder="Digite seu PIN" maxlength="4">
        <button onclick="logar()">Entrar</button>
    </div>

    <div class="card hidden card-painel" id="painel-card">
        <h2 id="titulo-painel" style="margin-bottom: 3px;">Agenda</h2>
        <div class="subtitulo-painel" style="margin-bottom: 18px;">Brooklyn Barbearia</div>

        <div class="semana-nav">
            <button class="semana-nav-btn" onclick="mudarSemana(-1)">‹</button>
            <span class="semana-label" id="semana-label"></span>
            <button class="semana-nav-btn" onclick="mudarSemana(1)">›</button>
        </div>

        <div class="dias-tabs" id="dias-tabs"></div>

        <div id="contador-agenda" class="contador-badge">Carregando contagem...</div>

        <div id="agenda-lista"></div>
        <button onclick="logout()" style="background: #333; color: #fff; margin-top: 20px;">Sair do Painel</button>
    </div>

    <script>
        // Os PINs não ficam mais aqui no código (essa página é pública e qualquer um podia ver
        // o código-fonte). O login agora é validado no servidor, na rota POST /login.
        let barbeiroLogado = '';
        let painelToken = sessionStorage.getItem('painel_token') || null;

        async function logar() {
            const barbeiro = document.getElementById('barbeiro').value;
            const pin = document.getElementById('pin').value;

            try {
                const res = await fetch('/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ barbeiro, pin })
                });
                const resposta = await res.json();

                if (!res.ok || !resposta.token) {
                    alert(resposta.error || 'PIN incorreto!');
                    return;
                }

                painelToken = resposta.token;
                sessionStorage.setItem('painel_token', painelToken);
                barbeiroLogado = barbeiro;

                document.getElementById('login-card').classList.add('hidden');
                document.getElementById('painel-card').classList.remove('hidden');
                document.getElementById('titulo-painel').innerText = "PAINEL - " + barbeiro.toUpperCase();

                semanaOffset = 0;
                const hoje = new Date();
                const diaSemanaHoje = hoje.getDay(); // 0=domingo
                // Se hoje for domingo (barbearia fechada), começa mostrando a segunda-feira seguinte
                diaSelecionadoIndex = (diaSemanaHoje === 0) ? 0 : (diaSemanaHoje - 1);

                renderSemana();
            } catch (err) {
                alert('Erro de conexão ao entrar no painel.');
            }
        }

        // índice 0 = segunda ... 5 = sábado
        let semanaOffset = 0;
        let diaSelecionadoIndex = 0;

        function obterDiasDaSemana(offset) {
            const hoje = new Date();
            const diaSemanaHoje = hoje.getDay(); // 0=domingo, 1=segunda...
            const deslocamentoAteSegunda = (diaSemanaHoje === 0) ? -6 : (1 - diaSemanaHoje);

            const segunda = new Date(hoje);
            segunda.setDate(hoje.getDate() + deslocamentoAteSegunda + (offset * 7));
            segunda.setHours(0, 0, 0, 0);

            const dias = [];
            for (let i = 0; i < 6; i++) {
                const d = new Date(segunda);
                d.setDate(segunda.getDate() + i);
                dias.push(d);
            }
            return dias;
        }

        function paraISO(data) {
            const ano = data.getFullYear();
            const mes = String(data.getMonth() + 1).padStart(2, '0');
            const dia = String(data.getDate()).padStart(2, '0');
            return `${ano}-${mes}-${dia}`;
        }

        function mudarSemana(delta) {
            semanaOffset += delta;
            renderSemana();
        }

        function renderSemana() {
            const dias = obterDiasDaSemana(semanaOffset);
            const nomesDias = ['SEG', 'TER', 'QUA', 'QUI', 'SEX', 'SÁB'];
            const meses = ['jan', 'fev', 'mar', 'abr', 'mai', 'jun', 'jul', 'ago', 'set', 'out', 'nov', 'dez'];

            const hojeISO = paraISO(new Date());

            document.getElementById('semana-label').innerText =
                `${dias[0].getDate()} - ${dias[5].getDate()} de ${meses[dias[0].getMonth()]}`;

            const tabsContainer = document.getElementById('dias-tabs');
            tabsContainer.innerHTML = '';

            dias.forEach((d, index) => {
                const iso = paraISO(d);
                const isHoje = iso === hojeISO;
                const isSelecionado = index === diaSelecionadoIndex;

                const tab = document.createElement('div');
                tab.className = 'dia-tab' + (isHoje ? ' hoje' : '') + (isSelecionado ? ' selecionado' : '');
                tab.innerHTML = `<span class="dia-nome">${nomesDias[index]}</span><span class="dia-numero">${d.getDate()}</span>`;
                tab.onclick = function () {
                    diaSelecionadoIndex = index;
                    renderSemana();
                };
                tabsContainer.appendChild(tab);
            });

            carregarAgenda();
        }

        function carregarAgenda() {
            const lista = document.getElementById('agenda-lista');
            const contadorEl = document.getElementById('contador-agenda');
            const dias = obterDiasDaSemana(semanaOffset);
            const dataSelecionada = paraISO(dias[diaSelecionadoIndex]);

            lista.innerHTML = '<p style="color: var(--text-muted); padding: 20px;">Carregando agendamentos...</p>';
            contadorEl.innerText = 'Calculando...';

            let url = '/agendamentos?barbeiro=' + encodeURIComponent(barbeiroLogado) + '&data=' + encodeURIComponent(dataSelecionada);

            fetch(url, { headers: { 'Authorization': 'Bearer ' + painelToken } })
                .then(function(res) {
                    if (res.status === 401) {
                        alert('Sua sessão expirou. Faça login novamente.');
                        logout();
                        return [];
                    }
                    return res.json();
                })
                .then(function(dados) {
                    renderizarLista(dados);
                })
                .catch(function() {
                    lista.innerHTML = '<p style="color: #ff6b6b; text-align: center;">Erro ao carregar agendamentos.</p>';
                    contadorEl.innerText = 'Erro ao carregar';
                });
        }

        function renderizarLista(dadosFiltrados) {
            const lista = document.getElementById('agenda-lista');
            const contadorEl = document.getElementById('contador-agenda');

            if (dadosFiltrados.length === 0) {
                contadorEl.innerText = '📅 Nenhum agendamento para esta data';
            } else if (dadosFiltrados.length === 1) {
                contadorEl.innerText = '📅 1 agendamento para esta data';
            } else {
                contadorEl.innerText = '📅 ' + dadosFiltrados.length + ' agendamentos para esta data';
            }

            lista.innerHTML = '';
            
            if (dadosFiltrados.length === 0) {
                lista.innerHTML = '<p style="color: var(--text-muted); text-align: center; padding: 30px 0;">Nenhum agendamento encontrado para esta data.</p>';
                return;
            }

            dadosFiltrados.forEach(function(item) {
                const telLimpo = (item.telefone_cliente || '').replace(/\D/g, '');
                const numeroFinal = telLimpo.startsWith('55') ? telLimpo : '55' + telLimpo;

                const nomeCliente = item.nome_cliente || item.nome || 'Cliente';
                const telCliente = item.telefone_cliente || '';
                const servicoCliente = item.servico || 'Corte';
                const horarioCliente = item.horario || '';
                const dataExibicao = item.data;

                const textoMsg = "✂️ *BROOKLYN BARBEARIA* 💈\n\n" +
                                 "Olá, *_" + nomeCliente + "_*! Passando para confirmar o seu horário conosco.\n\n" +
                                 "📋 *Serviço:* " + servicoCliente + "\n" +
                                 "📅 *Data:* " + dataExibidaFormatada(dataExibicao) + "\n" +
                                 "⏰ *Horário:* " + horarioCliente + "\n\n" +
                                 "⚠️ _Pedimos a gentileza de comparecer com alguns minutos de antecedência para mantermos nossa pontualidade._\n\n" +
                                 "Caso precise reagendar, avise-nos com antecedência. Te esperamos!";

                const linkWhatsApp = "https://wa.me/" + numeroFinal + "?text=" + encodeURIComponent(textoMsg);

                lista.innerHTML += `
                    <div class="agendamento-item">
                        <div class="agendamento-header">⏰ ${horarioCliente} - ${servicoCliente}</div>
                        <div class="agendamento-info">
                            👤 <strong>Cliente:</strong> ${nomeCliente}<br>
                            📞 <strong>Tel:</strong> ${telCliente} | 📅 <strong>Data:</strong> ${dataExibicao}
                        </div>
                        <div class="acoes-container">
                            <a href="${linkWhatsApp}" target="_blank" class="btn-whatsapp">💬 WhatsApp</a>
                            <button onclick="cancelarAgendamento(${item.id})" class="btn-cancelar">Cancelar</button>
                        </div>
                    </div>
                `;
            });
        }

        function dataExibidaFormatada(dataIso) {
            if (!dataIso) return '';
            const partes = dataIso.split('-');
            if (partes.length === 3) {
                return partes[2] + '/' + partes[1] + '/' + partes[0];
            }
            return dataIso;
        }

        function cancelarAgendamento(id) {
            if (!confirm('Deseja realmente cancelar este agendamento do cliente?')) return;

            fetch('/agendamentos/' + id, {
                method: 'DELETE',
                headers: { 'Authorization': 'Bearer ' + painelToken }
            })
                .then(function(res) { return res.json(); })
                .then(function(resposta) {
                    if (resposta.success) {
                        carregarAgenda();
                    } else {
                        alert(resposta.error || 'Erro ao cancelar agendamento.');
                    }
                })
                .catch(function() { alert('Erro de conexão ao cancelar.'); });
        }

        function logout() {
            painelToken = null;
            sessionStorage.removeItem('painel_token');
            document.getElementById('pin').value = '';
            document.getElementById('painel-card').classList.add('hidden');
            document.getElementById('login-card').classList.remove('hidden');
        }
    </script>
</body>
</html>
