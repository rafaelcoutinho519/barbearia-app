<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel dos Barbeiros - Brooklyn Barbearia</title>
    <style>
        :root {
            --bg-main: #121212;
            --card-bg: #1a1a1a;
            --gold: #d4af37;
            --gold-hover: #e6c552;
            --text-main: #ffffff;
            --text-muted: #a0a0a0;
            --border-color: #2a2a2a;
        }

        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background: var(--bg-main); 
            color: var(--text-main); 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
            margin: 0; 
            padding: 15px;
            box-sizing: border-box;
        }

        .card { 
            background: var(--card-bg); 
            padding: 30px 25px; 
            border-radius: 12px; 
            box-shadow: 0 8px 24px rgba(0,0,0,0.6); 
            width: 100%; 
            max-width: 450px; 
            text-align: center; 
            border: 1px solid var(--border-color);
        }

        h2 {
            color: var(--gold);
            letter-spacing: 0.5px;
            margin-bottom: 20px;
            font-size: 22px;
        }

        input, select, button { 
            width: 100%; 
            padding: 14px; 
            margin-top: 15px; 
            border-radius: 6px; 
            border: 1px solid var(--border-color); 
            background: #242424; 
            color: var(--text-main); 
            box-sizing: border-box; 
            font-size: 15px;
            outline: none;
            transition: all 0.3s ease;
        }

        input:focus, select:focus {
            border-color: var(--gold);
        }

        button { 
            background: var(--gold); 
            color: #121212; 
            font-weight: bold; 
            cursor: pointer; 
            border: none; 
            box-shadow: 0 4px 12px rgba(212, 175, 55, 0.2);
        }

        button:hover { 
            background: var(--gold-hover); 
            transform: translateY(-1px);
        }

        .hidden { display: none; }

        .contador-badge {
            background: rgba(212, 175, 55, 0.1);
            border: 1px solid rgba(212, 175, 55, 0.3);
            color: var(--gold);
            padding: 10px;
            border-radius: 6px;
            font-size: 14px;
            font-weight: bold;
            margin-bottom: 15px;
            text-align: center;
        }

        .agendamento-item { 
            background: #222222; 
            padding: 16px; 
            margin-top: 15px; 
            border-radius: 8px; 
            text-align: left; 
            border-left: 4px solid var(--gold);
            box-shadow: 0 2px 6px rgba(0,0,0,0.3);
        }

        .agendamento-header {
            font-size: 16px;
            color: var(--gold);
            margin-bottom: 8px;
            font-weight: bold;
        }

        .agendamento-info {
            font-size: 14px;
            color: var(--text-muted);
            line-height: 1.5;
        }

        .agendamento-info strong {
            color: var(--text-main);
        }

        .acoes-container {
            margin-top: 12px; 
            display: flex; 
            gap: 10px; 
        }

        .btn-whatsapp {
            background: #25d366; 
            color: #fff; 
            padding: 10px 12px; 
            text-decoration: none; 
            border-radius: 6px; 
            font-weight: bold; 
            font-size: 13px; 
            text-align: center; 
            flex: 1;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            box-shadow: none;
        }
        .btn-whatsapp:hover { background: #20ba5a; transform: none; }

        .btn-cancelar {
            background: #b93a3a; 
            color: #fff; 
            padding: 10px 12px; 
            border: none; 
            border-radius: 6px; 
            cursor: pointer; 
            font-size: 13px; 
            width: auto; 
            margin-top: 0; 
            flex: 1;
            box-shadow: none;
        }
        .btn-cancelar:hover { background: #a03030; transform: none; }

        #agenda-lista {
            max-height: 380px; 
            overflow-y: auto; 
            padding-right: 2px;
        }

        #agenda-lista::-webkit-scrollbar {
            width: 6px;
        }
        #agenda-lista::-webkit-scrollbar-thumb {
            background: #333;
            border-radius: 3px;
        }
    </style>
</head>
<body>

    <div class="card" id="login-card">
        <h2>Painel dos Barbeiros</h2>
        <select id="barbeiro">
            <option value="Karlos">Karlos</option>
            <option value="Dorgivan">Dorgivan</option>
            <option value="David">David</option>
        </select>
        <input type="password" id="pin" placeholder="Digite seu PIN" maxlength="4">
        <button onclick="logar()">Entrar</button>
    </div>

    <div class="card hidden" id="painel-card">
        <h2 id="titulo-painel" style="margin-bottom: 5px;">Agenda</h2>
        
        <div id="contador-agenda" class="contador-badge">Carregando contagem...</div>

        <div style="margin-bottom: 15px; text-align: left;">
            <label style="font-size: 12px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px;">Filtrar por Data:</label>
            <input type="date" id="filtro-data" onchange="mudarFiltroData()">
        </div>
        <div id="agenda-lista"></div>
        <button onclick="logout()" style="background: #333; color: #fff; margin-top: 20px;">Sair do Painel</button>
    </div>

    <script>
        const pins = { "Karlos": "1234", "Dorgivan": "5678", "David": "9876" };
        let dadosAtuais = [];
        let barbeiroLogado = '';

        function logar() {
            const barbeiro = document.getElementById('barbeiro').value;
            const pin = document.getElementById('pin').value;

            if (pins[barbeiro] === pin) {
                barbeiroLogado = barbeiro;
                document.getElementById('login-card').classList.add('hidden');
                document.getElementById('painel-card').classList.remove('hidden');
                document.getElementById('titulo-painel').innerText = "PAINEL - " + barbeiro.toUpperCase();
                
                const hoje = new Date().toISOString().split('T')[0];
                document.getElementById('filtro-data').value = hoje;

                carregarAgenda(barbeiro);
            } else {
                alert('PIN incorreto!');
            }
        }

        function carregarAgenda(barbeiro) {
            const lista = document.getElementById('agenda-lista');
            const contadorEl = document.getElementById('contador-agenda');
            
            lista.innerHTML = '<p style="color: var(--text-muted); padding: 20px;">Carregando agendamentos...</p>';
            contadorEl.innerText = 'Calculando...';

            let url = '/agendamentos?barbeiro=' + encodeURIComponent(barbeiro);

            fetch(url)
                .then(function(res) { return res.json(); })
                .then(function(dados) {
                    dadosAtuais = dados;
                    renderizarLista();
                })
                .catch(function() {
                    lista.innerHTML = '<p style="color: #ff6b6b; text-align: center;">Erro ao carregar agendamentos.</p>';
                    contadorEl.innerText = 'Erro ao carregar';
                });
        }

        function mudarFiltroData() {
            renderizarLista();
        }

        function normalizarData(dataStr) {
            if (!dataStr) return '';
            
            if (/^\d{4}-\d{2}-\d{2}$/.test(dataStr)) {
                return dataStr;
            }

            const mesesMap = {
                'jan': '01', 'fev': '02', 'mar': '03', 'abr': '04', 'mai': '05', 'jun': '06',
                'jul': '07', 'ago': '08', 'set': '09', 'out': '10', 'nov': '11', 'dez': '12'
            };
            
            let strLower = dataStr.toLowerCase();
            for (let mesAbrev in mesesMap) {
                if (strLower.includes(mesAbrev)) {
                    let numeros = dataStr.match(/\d+/g);
                    if (numeros && numeros.length >= 2) {
                        let dia = numeros[0].padStart(2, '0');
                        let ano = numeros[numeros.length - 1];
                        let mes = mesesMap[mesAbrev];
                        return `${ano}-${mes}-${dia}`;
                    }
                }
            }

            if (dataStr.includes('/')) {
                let partes = dataStr.split('/');
                if (partes.length === 3) {
                    let ano = partes[2].length === 2 ? '20' + partes[2] : partes[2];
                    return `${ano}-${partes[1].padStart(2, '0')}-${partes[0].padStart(2, '0')}`;
                }
            }

            let limpa = dataStr.includes('T') ? dataStr.split('T')[0] : dataStr.split(' ')[0];
            return limpa.trim();
        }

        function renderizarLista() {
            const lista = document.getElementById('agenda-lista');
            const contadorEl = document.getElementById('contador-agenda');
            const valorInputBruto = document.getElementById('filtro-data').value;
            
            const dataFiltro = normalizarData(valorInputBruto);
            
            const dadosFiltrados = dadosAtuais.filter(function(item) {
                if (!item.data) return false;
                return normalizarData(item.data) === dataFiltro;
            });

            if (dadosFiltrados.length === 0) {
                contadorEl.innerText = '📅 Nenhum agendamento para esta data';
            } else if (dadosFiltrados.length === 1) {
                contadorEl.innerText = '📅 1 agendamento para esta data';
            } else {
                contadorEl.innerText = '📅 ' + dadosFiltrados.length + ' agendamentos para esta data';
            }

            lista.innerHTML = '';
            
            if (dadosFiltrados.length === 0) {
                lista.innerHTML = '<p style="color: var(--text-muted); text-align: center; padding: 30px 0;">Nenhum agendamento encontrado para esta data.</p>';
                return;
            }

            dadosFiltrados.forEach(function(item) {
                const telLimpo = (item.telefone_cliente || '').replace(/\D/g, '');
                const numeroFinal = telLimpo.startsWith('55') ? telLimpo : '55' + telLimpo;

                const nomeCliente = item.nome_cliente || item.nome || 'Cliente';
                const telCliente = item.telefone_cliente || '';
                const servicoCliente = item.servico || 'Corte';
                const horarioCliente = item.horario || '';
                const dataExibicao = normalizarData(item.data);

                const textoMsg = "✂️ *BROOKLYN BARBEARIA* 💈\n\n" +
                                 "Olá, *_" + nomeCliente + "_*! Passando para confirmar o seu horário conosco.\n\n" +
                                 "📋 *Serviço:* " + servicoCliente + "\n" +
                                 "📅 *Data:* " + dataExibidaFormatada(dataExibicao) + "\n" +
                                 "⏰ *Horário:* " + horarioCliente + "\n\n" +
                                 "⚠️ _Pedimos a gentileza de comparecer com alguns minutos de antecedência para mantermos nossa pontualidade._\n\n" +
                                 "Caso precise reagendar, avise-nos com antecedência. Te esperamos!";

                const linkWhatsApp = "https://wa.me/" + numeroFinal + "?text=" + encodeURIComponent(textoMsg);

                lista.innerHTML += `
                    <div class="agendamento-item">
                        <div class="agendamento-header">⏰ ${horarioCliente} - ${servicoCliente}</div>
                        <div class="agendamento-info">
                            👤 <strong>Cliente:</strong> ${nomeCliente}<br>
                            📞 <strong>Tel:</strong> ${telCliente} | 📅 <strong>Data:</strong> ${dataExibicao}
                        </div>
                        <div class="acoes-container">
                            <a href="${linkWhatsApp}" target="_blank" class="btn-whatsapp">💬 WhatsApp</a>
                            <button onclick="cancelarAgendamento(${item.id})" class="btn-cancelar">Cancelar</button>
                        </div>
                    </div>
                `;
            });
        }

        // Correção do nome da função para corresponder à chamada acima
        function dataExibidaFormatada(dataIso) {
            if (!dataIso) return '';
            const partes = dataIso.split('-');
            if (partes.length === 3) {
                return partes[2] + '/' + partes[1] + '/' + partes[0];
            }
            return dataIso;
        }

        function cancelarAgendamento(id) {
            if (!confirm('Deseja realmente cancelar este agendamento do cliente?')) return;

            fetch('/agendamentos/' + id, { method: 'DELETE' })
                .then(function(res) { return res.json(); })
                .then(function(resposta) {
                    if (resposta.success) {
                        carregarAgenda(barbeiroLogado);
                    } else {
                        alert('Erro ao cancelar agendamento.');
                    }
                })
                .catch(function() { alert('Erro de conexão ao cancelar.'); });
        }

        function logout() {
            document.getElementById('pin').value = '';
            document.getElementById('painel-card').classList.add('hidden');
            document.getElementById('login-card').classList.remove('hidden');
        }
    </script>
</body>
</html>
