<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Barbearia Navalha de Ouro — Agendamento Online</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="topbar">
    <div class="container topbar-inner">
      <a href="#home" class="brand">SHOWROOM <span>BARBEARIA</span></a>
      <nav class="nav" id="nav"></nav>
    </div>
  </header>

  <main id="app" class="container"></main>

  <footer class="footer">
    <div class="container">
      <p>&copy; <span id="year"></span> Showroom Barbearia. Todos os direitos reservados.</p>
    </div>
  </footer>

  <div id="toast" class="toast hidden"></div>

  <!-- MODAL DE DETALHES DO CORTE -->
  <div id="cutModal" class="modal-overlay" onclick="fecharModal(event)">
    <div class="modal-content">
      <img id="modalImage" src="" alt="Foto do Corte" class="modal-img">
      <h3 id="modalTitle" class="modal-title"></h3>
      <p id="modalDescription" class="modal-description"></p>
      <button class="modal-close-btn" onclick="fecharModalBtn()">Fechar</button>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
