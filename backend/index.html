<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Barbearia - Agendamento Online</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <!-- Cabeçalho Principal -->
    <header class="main-header">
        <div class="container header-content">
            <div class="logo">
                <i class="fa-solid fa-scissors"></i>
                <span>Barbearia</span>
            </div>
            <nav class="desktop-nav">
                <a href="#inicio">Início</a>
                <a href="#servicos">Serviços</a>
                <a href="#agendamento">Agendar</a>
            </nav>
        </div>
    </header>

    <!-- Seção Principal / Hero -->
    <section id="inicio" class="hero-section">
        <div class="container">
            <h1>Estilo e Tradição</h1>
            <p>Garanta seu horário com os melhores profissionais de forma rápida e prática.</p>
        </div>
    </section>

    <!-- Seção de Agendamento -->
    <main id="agendamento" class="container booking-container">
        <div class="card-booking">
            <h2>Faça seu Agendamento</h2>
            <form id="booking-form">
                <div class="form-group">
                    <label for="client-name">Seu Nome</label>
                    <input type="text" id="client-name" placeholder="Digite seu nome completo" required>
                </div>

                <div class="form-group">
                    <label for="client-phone">Seu WhatsApp</label>
                    <input type="tel" id="client-phone" placeholder="(XX) 9XXXX-XXXX" required>
                </div>

                <div class="form-group">
                    <label for="barber-select">Escolha o Profissional</label>
                    <select id="barber-select" required>
                        <option value="">Selecione...</option>
                        <option value="Karlos">Karlos</option>
                        <option value="David">David</option>
                        <option value="Dorgivan">Dorgivan</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="service-select">Escolha o Serviço</label>
                    <select id="service-select" required>
                        <option value="">Selecione...</option>
                        <option value="Corte">Corte</option>
                        <option value="Barba">Barba</option>
                        <option value="Corte + Barba">Corte + Barba</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="booking-date">Data e Horário</label>
                    <input type="datetime-local" id="booking-date" required>
                </div>

                <button type="submit" class="btn-submit">Confirmar Agendamento via WhatsApp</button>
            </form>
        </div>
    </main>

    <!-- Rodapé / Navegação Inferior para Mobile -->
    <nav class="mobile-bottom-nav">
        <a href="#inicio" class="nav-item"><i class="fa-solid fa-house"><span>Início</span></i></a>
        <a href="#agendamento" class="nav-item"><i class="fa-solid fa-calendar-days"><span>Agendar</span></i></a>
    </nav>
</body>
</html>
