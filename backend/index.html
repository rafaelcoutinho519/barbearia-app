<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel do Barbeiro - Brooklyn Barbearia</title>
    <style>
        :root {
            --bg-color: #0c0c0c;
            --card-bg: #161616;
            --card-border: #262626;
            --gold: #d4af37;
            --gold-light: #f3e5ab;
            --text-main: #f0f0f0;
            --text-muted: #999;
            --danger: #ff4d4d;
            --success: #25d366;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', system-ui, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            padding: 20px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            width: 100%;
            max-width: 800px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
            padding-top: 20px;
        }

        h1 {
            color: var(--gold);
            font-family: 'Georgia', serif;
            letter-spacing: 2px;
            font-size: 1.8rem;
            text-transform: uppercase;
        }

        /* TELA DE LOGIN DO BARBEIRO */
        #loginScreen {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 12px;
            padding: 30px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.6);
            max-width: 400px;
            margin: 40px auto;
        }

        .barber-select-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            margin: 20px 0;
        }

        .barber-option {
            background: #0c0c0c;
            border: 1px solid var(--card-border);
            border-radius: 8px;
            padding: 12px 8px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .barber-option:hover {
            border-color: var(--gold);
            background: rgba(212, 175, 55, 0.08);
        }

        .barber-option img {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid var(--gold);
            margin: 0 auto 8px auto;
            display: block;
        }

        .barber-option span {
            font-size: 0.85rem;
            font-weight: 600;
            color: #fff;
            text-transform: uppercase;
        }

        /* PAINEL INTERNO */
        #dashboardScreen {
            display: none;
            width: 100%;
        }

        .dashboard-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 25px;
        }

        .barber-info-logged {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .barber-info-logged img {
            width: 55px;
            height: 55px;
            border-radius: 50%;
            border: 2px solid var(--gold);
            object-fit: cover;
        }

        .barber-info-logged h2 {
            color: var(--gold-light);
            font-size: 1.2rem;
            text-transform: uppercase;
        }

        .btn-logout {
            background: transparent;
            color: var(--danger);
            border: 1px solid rgba(255, 77, 77, 0.3);
            padding: 8px 15px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.8rem;
            font-weight: bold;
            text-transform: uppercase;
        }

        .btn-logout:hover {
            background: var(--danger);
            color: #fff;
        }

        .filter-section {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            align-items: center;
            background: var(--card-bg);
            padding: 15px;
            border-radius: 10px;
            border: 1px solid var(--card-border);
            flex-wrap: wrap;
        }

        .filter-section label {
            font-size: 0.85rem;
            color: var(--text-muted);
            text-transform: uppercase;
        }

        .filter-section input {
            background: #0c0c0c;
            border: 1px solid var(--card-border);
            color: #fff;
            padding: 8px 12px;
            border-radius: 6px;
            outline: none;
        }

        .appointments-list {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .appointment-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-left: 4px solid var(--gold);
            border-radius: 10px;
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.4);
        }

        @media(max-width: 600px) {
            .appointment-card {
                flex-direction: column;
                align-items: flex-start;
                gap: 15px;
            }
        }

        .app-details h3 {
            color: var(--gold);
            font-size: 1.1rem;
            margin-bottom: 5px;
            text-transform: uppercase;
        }

        .app-details p {
            font-size: 0.9rem;
            color: var(--text-muted);
            margin-bottom: 3px;
        }

        .app-details strong {
            color: #fff;
        }

        .app-actions {
            display: flex;
            flex-direction: column;
            gap: 8px;
            width: 220px;
        }

        .btn-whatsapp {
            background-color: var(--success);
            color: #fff;
            padding: 8px 12px;
            border-radius: 6px;
            text-decoration: none;
            font-size: 0.8rem;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            transition: opacity 0.2s;
            text-align: center;
        }

        .btn-whatsapp:hover { opacity: 0.9; }

        .row-actions {
            display: flex;
            gap: 8px;
        }

        .btn-cancel {
            background: rgba(255, 77, 77, 0.1);
            color: var(--danger);
            border: 1px solid rgba(255, 77, 77, 0.3);
            padding: 8px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.8rem;
            font-weight: bold;
            text-transform: uppercase;
            flex: 1;
        }

        .btn-cancel:hover {
            background: var(--danger);
            color: #fff;
        }

        .empty-state {
            text-align: center;
            padding: 40px;
            color: var(--text-muted);
            background: var(--card-bg);
            border-radius: 10px;
            border: 1px solid var(--card-border);
        }

        .back-link {
            display: inline-block;
            margin-top: 30px;
            color: var(--text-muted);
            text-decoration: none;
            font-size: 0.85rem;
            transition: color 0.2s;
        }

        .back-link:hover { color: var(--gold); }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>Painel do Barbeiro</h1>
        </header>

        <!-- TELA DE ESCOLHA DO PROFISSIONAL -->
        <div id="loginScreen">
            <p style="color: var(--text-muted); font-size: 0.9rem; margin-bottom: 15px;">Selecione seu perfil para acessar a agenda:</p>
            <div class="barber-select-grid">
                <div class="barber-option" onclick="loginBarber('Karlos')">
                    <img src="Karlos/perfil.png" alt="Karlos">
                    <span>Karlos</span>
                </div>
                <div class="barber-option" onclick="loginBarber('Dorgivan')">
                    <img src="Dorgivan/perfil.jpg" alt="Dorgivan">
                    <span>Dorgivan</span>
                </div>
                <div class="barber-option" onclick="loginBarber('David')">
                    <img src="David/perfil.jpg" alt="David">
                    <span>David</span>
                </div>
            </div>
        </div>

        <!-- PAINEL COM OS AGENDAMENTOS -->
        <div id="dashboardScreen">
            <div class="dashboard-header">
                <div class="barber-info-logged">
                    <img id="loggedBarberAvatar" src="" alt="Avatar">
                    <div>
                        <span style="font-size: 0.75rem; color: var(--text-muted); text-transform: uppercase;">Bem-vindo,</span>
                        <h2 id="loggedBarberName">Barbeiro</h2>
                    </div>
                </div>
                <button class="btn-logout" onclick="logoutBarber()">Sair</button>
            </div>

            <div class="filter-section">
                <label>Filtrar por Data:</label>
                <input type="date" id="filterDate" onchange="renderBarberAppointments()">
                <button onclick="clearDateFilter()" style="background:none; border:none; color: var(--gold); cursor:pointer; font-size: 0.8rem; text-decoration: underline;">Ver Todos</button>
            </div>

            <div id="barberAppointmentsList" class="appointments-list">
                <!-- Preenchido via JavaScript -->
            </div>
        </div>

        <div style="text-align: center;">
            <a href="index.html" class="back-link">&larr; Voltar para o site principal da barbearia</a>
        </div>
    </div>

    <script>
        const barberImages = {
            "Karlos": "Karlos/perfil.png",
            "Dorgivan": "Dorgivan/perfil.jpg",
            "David": "David/perfil.jpg"
        };

        let currentLoggedBarber = localStorage.getItem('brooklyn_logged_barber') || null;

        function initPanel() {
            if (currentLoggedBarber) {
                document.getElementById('loginScreen').style.display = 'none';
                document.getElementById('dashboardScreen').style.display = 'block';
                document.getElementById('loggedBarberName').innerText = currentLoggedBarber;
                document.getElementById('loggedBarberAvatar').src = barberImages[currentLoggedBarber];
                
                const todayStr = new Date().toISOString().split('T')[0];
                document.getElementById('filterDate').value = todayStr;

                renderBarberAppointments();
            } else {
                document.getElementById('loginScreen').style.display = 'block';
                document.getElementById('dashboardScreen').style.display = 'none';
            }
        }

        function loginBarber(barberName) {
            currentLoggedBarber = barberName;
            localStorage.setItem('brooklyn_logged_barber', barberName);
            initPanel();
        }

        function logoutBarber() {
            currentLoggedBarber = null;
            localStorage.removeItem('brooklyn_logged_barber');
            initPanel();
        }

        function clearDateFilter() {
            document.getElementById('filterDate').value = '';
            renderBarberAppointments();
        }

        function renderBarberAppointments() {
            const listContainer = document.getElementById('barberAppointmentsList');
            const selectedDate = document.getElementById('filterDate').value;
            const appointments = JSON.parse(localStorage.getItem('brooklyn_appointments') || '[]');

            let barberApps = appointments.filter(a => a.pro === currentLoggedBarber);

            if (selectedDate) {
                barberApps = barberApps.filter(a => a.date === selectedDate);
            }

            barberApps.sort((a, b) => {
                return new Date(`${a.date}T${a.time}`) - new Date(`${b.date}T${b.time}`);
            });

            if (barberApps.length === 0) {
                listContainer.innerHTML = `
                    <div class="empty-state">
                        <p>Nenhum agendamento encontrado para ${selectedDate ? 'esta data' : 'o momento'}.</p>
                    </div>
                `;
                return;
            }

            listContainer.innerHTML = barberApps.map(app => {
                const [year, month, day] = app.date.split('-');
                const formattedDate = `${day}/${month}/${year}`;

                const cleanPhone = app.phone.replace(/\D/g, '');
                
                const lembreteMessage = encodeURIComponent(`Olá ${app.clientName}, tudo bem? Aqui é o ${app.pro} da Brooklyn Barbearia. Passando para confirmar nosso agendamento de ${app.service} hoje às ${app.time}. Podemos confirmar? Caso precise cancelar ou reagendar, por favor me avise por aqui para liberarmos o horário.`);

                return `
                    <div class="appointment-card">
                        <div class="app-details">
                            <h3>${app.service}</h3>
                            <p>Cliente: <strong>${app.clientName}</strong></p>
                            <p>Telefone: <strong>${app.phone}</strong></p>
                            <p>Data e Hora: <strong>${formattedDate} às ${app.time}</strong></p>
                        </div>
                        <div class="app-actions">
                            <a href="https://wa.me/55${cleanPhone}?text=${lembreteMessage}" target="_blank" class="btn-whatsapp">
                                🔔 Enviar Lembrete
                            </a>
                            <div class="row-actions">
                                <a href="https://wa.me/55${cleanPhone}" target="_blank" class="btn-whatsapp" style="background:#333; font-size:0.75rem;">
                                    Chat
                                </a>
                                <button class="btn-cancel" onclick="cancelBarberAppointment(${app.id})">Cancelar</button>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function cancelBarberAppointment(appId) {
            if (confirm('Tem certeza que deseja cancelar? O horário será liberado imediatamente no site para novos clientes.')) {
                let appointments = JSON.parse(localStorage.getItem('brooklyn_appointments') || '[]');
                appointments = appointments.filter(a => a.id !== appId);
                localStorage.setItem('brooklyn_appointments', JSON.stringify(appointments));
                renderBarberAppointments();
            }
        }

        window.onload = initPanel;
    </script>
</body>
</html>
