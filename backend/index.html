<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Brooklyn Barbearia - Agendamentos</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #121212;
            color: #e0e0e0;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            background: #1e1e1e;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }
        h1, h2 {
            color: #d4af37;
            text-align: center;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            color: #b0b0b0;
        }
        input, select {
            width: 100%;
            padding: 10px;
            background: #2d2d2d;
            border: 1px solid #444;
            color: #fff;
            border-radius: 4px;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            padding: 12px;
            background: #d4af37;
            color: #121212;
            border: none;
            border-radius: 4px;
            font-weight: bold;
            cursor: pointer;
            font-size: 16px;
        }
        button:hover {
            background: #c5a028;
        }
        .lista-agendamentos {
            margin-top: 30px;
        }
        .card-agendamento {
            background: #252525;
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 10px;
            border-left: 4px solid #d4af37;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .btn-whatsapp {
            background: #25D366;
            color: white;
            border: none;
            padding: 8px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
            width: auto;
        }
        .btn-whatsapp:hover {
            background: #20ba5a;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Brooklyn Barbearia</h1>
        
        <h2>Novo Agendamento</h2>
        <form id="formAgendamento">
            <div class="form-group">
                <label>Nome do Cliente:</label>
                <input type="text" id="nome_cliente" required placeholder="Ex: Izabaleee">
            </div>
            <div class="form-group">
                <label>Telefone do Cliente (com DDD):</label>
                <input type="text" id="telefone_cliente" required placeholder="Ex: 87996342515">
            </div>
            <div class="form-group">
                <label>Barbeiro:</label>
                <select id="barbeiro_id" required>
                    <!-- Preenchido via JS -->
                </select>
            </div>
            <div class="form-group">
                <label>Data e Horário:</label>
                <input type="datetime-local" id="horario" required>
            </div>
            <button type="submit">Agendar e Enviar Confirmação</button>
        </form>

        <div class="lista-agendamentos">
            <h2>Agendamentos Realizados</h2>
            <div id="containerAgendamentos">Carregando...</div>
        </div>
    </div>

    <script>
        // Carrega barbeiros ao iniciar
        async function carregarBarbeiros() {
            try {
                const res = await fetch('/barbeiros');
                const barbeiros = await res.json();
                const select = document.getElementById('barbeiro_id');
                select.innerHTML = '';
                barbeiros.forEach(b => {
                    const option = document.createElement('option');
                    option.value = b.id;
                    option.textContent = b.nome;
                    select.appendChild(option);
                });
            } catch (err) {
                console.error('Erro ao carregar barbeiros:', err);
            }
        }

        // Carrega lista de agendamentos
        async function carregarAgendamentos() {
            try {
                const res = await fetch('/agendamentos');
                const agendamentos = await res.json();
                const container = document.getElementById('containerAgendamentos');
                
                if (agendamentos.length === 0) {
                    container.innerHTML = '<p style="text-align:center; color:#777;">Nenhum agendamento encontrado.</p>';
                    return;
                }

                container.innerHTML = '';
                agendamentos.forEach(a => {
                    const card = document.createElement('div');
                    card.className = 'card-agendamento';
                    
                    // Formata data bonita se quiser
                    card.innerHTML = `
                        <div>
                            <strong>${a.nome_cliente}</strong> (${a.telefone_cliente})<br>
                            <small>📅 ${a.horario} | 💈 ${a.barbeiro_nome}</small>
                        </div>
                        <button class="btn-whatsapp" onclick="enviarLembrete('${a.nome_cliente}', '${a.telefone_cliente}', '${a.horario}', '${a.barbeiro_nome}')">
                            💬 Lembrete
                        </button>
                    `;
                    container.appendChild(card);
                });
            } catch (err) {
                console.error('Erro ao carregar agendamentos:', err);
            }
        }

        // Enviar Lembrete via WhatsApp (1 Clique)
        function enviarLembrete(nome, telefone, horario, barbeiro) {
            const numeroLimpo = telefone.replace(/\D/g, '');
            const texto = `*⏰ LEMBRETE - BROOKLYN BARBEARIA*\n\nOlá, *${nome}*! Passando para lembrar do seu agendamento em *${horario}* com o profissional *${barbeiro}*.\n\nEstamos te esperando! 💈`;
            const url = `https://api.whatsapp.com/send?phone=55${numeroLimpo}&text=${encodeURIComponent(texto)}`;
            window.open(url, '_blank');
        }

        // Trata o envio do formulário
        document.getElementById('formAgendamento').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const nome_cliente = document.getElementById('nome_cliente').value;
            const telefone_cliente = document.getElementById('telefone_cliente').value;
            const barbeiro_id = document.getElementById('barbeiro_id').value;
            const horario = document.getElementById('horario').value;

            try {
                const res = await fetch('/agendamentos', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ nome_cliente, telefone_cliente, barbeiro_id, horario })
                });

                const data = await res.json();
                if (data.success) {
                    // Dispara o WhatsApp de confirmação imediata também (como você já fazia)
                    const selectBarbeiro = document.getElementById('barbeiro_id');
                    const nomeBarbeiro = selectBarbeiro.options[selectBarbeiro.selectedIndex].text;
                    const numeroLimpo = telefone_cliente.replace(/\D/g, '');
                    
                    const msgConfirmacao = `*NOVO AGENDAMENTO - BROOKLYN BARBEARIA*\n\n🔹 Cliente: ${nome_cliente}\n🔹 Telefone: ${telefone_cliente}\n🔹 Profissional: ${nomeBarbeiro}\n🔹 Horário: ${horario}`;
                    window.open(`https://api.whatsapp.com/send?phone=55${numeroLimpo}&text=${encodeURIComponent(msgConfirmacao)}`, '_blank');

                    document.getElementById('formAgendamento').reset();
                    carregarAgendamentos();
                } else {
                    alert('Erro ao salvar agendamento.');
                }
            } catch (err) {
                console.error('Erro:', err);
                alert('Erro de conexão.');
            }
        });

        // Inicializa dados na tela
        carregarBarbeiros();
        carregarAgendamentos();
    </script>
</body>
</html>
